<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng Quay Tên Ngẫu Nhiên</title>
  <style>
    :root {
      --primary: #ff4757;
      --secondary: #2f3542;
      --accent: #ffa502;
      --bg: #f1f2f6;
      --text: #2f3542;
      --panel-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
    }

    /* Container chính */
    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    /* Khu vực vòng quay */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .wheel-container {
      position: relative;
      width: 400px;
      height: 400px;
      max-width: 90vw;
      max-height: 90vw;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 0.1s;
    }

    /* Mũi tên chỉ định */
    .indicator {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 50px;
      background-color: var(--primary);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    /* Nút quay ở giữa */
    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background: white;
      border-radius: 50%;
      border: 4px solid var(--primary);
      color: var(--primary);
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      z-index: 5;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spin-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .spin-btn:disabled {
      background: #ccc;
      border-color: #999;
      color: #666;
      cursor: not-allowed;
    }

    /* Controls dưới vòng quay */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      background-color: var(--secondary);
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button.primary {
      background-color: var(--primary);
    }

    button.accent {
      background-color: var(--accent);
      color: #333;
    }

    /* Admin Panel */
    .admin-panel {
      flex: 1;
      min-width: 300px;
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      max-height: 80vh;
      overflow-y: auto;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* Form thêm/sửa */
    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9em;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      min-height: 150px;
      font-family: inherit;
      resize: vertical;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .winner-icon {
      font-size: 60px;
      margin-bottom: 10px;
      display: block;
    }

    .winner-title {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .winner-desc {
      color: #666;
      margin-bottom: 20px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
    }

    /* History List */
    .history-list {
      list-style: none;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 6px;
    }

    .history-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 0.9em;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .wheel-container {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <h1>Vòng Quay Tên Ngẫu Nhiên</h1>

  <div class="main-container">
    <!-- Khu vực vòng quay -->
    <div class="wheel-section">
      <div class="wheel-container">
        <div class="indicator"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
        <button class="spin-btn" id="spinBtn">QUAY</button>
      </div>
      <div class="controls">
        <button id="toggleSoundBtn">🔊 Bật âm thanh</button>
        <button id="autoSpinBtn">🔄 Quay tự động</button>
      </div>
    </div>

    <!-- Khu vực Admin (Chỉ còn Name Mode) -->
    <div class="admin-panel">
      <div id="nameModeContent">
        <div class="admin-header">
          <h2>Nhập danh sách tên</h2>
        </div>
        <div class="form-group">
          <label>Nhập tên (mỗi tên một dòng):</label>
          <textarea id="nameInput" placeholder="Nguyễn Văn A&#10;Trần Thị B&#10;Lê Văn C"></textarea>
        </div>
        <button class="primary" id="updateNameWheelBtn" style="width: 100%">Cập nhật vòng quay</button>

        <div style="margin-top: 20px;">
          <h3>Lịch sử quay</h3>
          <ul class="history-list" id="historyList">
            <!-- History items -->
          </ul>
          <button class="btn-sm" id="clearHistoryBtn" style="margin-top: 5px; background: #ccc;">Xóa lịch sử</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Kết Quả -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-content">
      <span class="winner-icon" id="modalIcon">🎉</span>
      <h2 class="winner-title" id="modalTitle">Chúc mừng!</h2>
      <p class="winner-desc" id="modalDesc">Người thắng cuộc</p>

      <!-- Buttons for Name Mode -->
      <div id="nameModeButtons" style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="primary" id="keepWinnerBtn" style="flex: 1; background: #7bed9f; color: #2f3542;">Giữ
          lại</button>
        <button class="primary" id="removeWinnerBtn" style="flex: 1; background: #ff6b6b;">Xóa tên này</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Thông báo</div>

  <script>
    /**
     * RANDOM NAME PICKER APP
     */

    // --- STATE ---
    let nameList = [];
    let history = [];
    let currentWinner = null;

    let isSpinning = false;
    let currentRotation = 0;
    let soundEnabled = true;
    let audioCtx = null;

    // --- DOM ELEMENTS ---
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const modal = document.getElementById('resultModal');

    // --- INITIALIZATION ---
    function init() {
      loadData();
      // If no data, set some defaults for demo
      if (nameList.length === 0) {
        document.getElementById('nameInput').value = "Nguyễn Văn A\nTrần Thị B\nLê Văn C\nPhạm Thị D\nHoàng Văn E";
        parseNames();
      } else {
        drawWheel();
      }
      setupEventListeners();
    }

    // --- DATA MANAGEMENT ---
    function loadData() {
      // Load Names
      const savedNames = localStorage.getItem('lucky_spin_names');
      if (savedNames) {
        document.getElementById('nameInput').value = savedNames;
        parseNames();
      }

      // Load History
      const savedHistory = localStorage.getItem('lucky_spin_history');
      if (savedHistory) {
        history = JSON.parse(savedHistory);
        updateHistoryUI();
      }
    }

    // --- NAME PICKER LOGIC ---
    function parseNames() {
      const input = document.getElementById('nameInput').value;
      const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      // Generate colors
      const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#ff6b81', '#7bed9f', '#70a1ff', '#5352ed'];

      nameList = lines.map((name, index) => ({
        id: index,
        title: name,
        color: colors[index % colors.length],
        weight: 1,
        icon: '👤',
        description: 'Người thắng cuộc'
      }));

      localStorage.setItem('lucky_spin_names', input);
      drawWheel();
    }

    function updateHistoryUI() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      history.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.textContent = `${index + 1}. ${item}`;
        list.appendChild(li);
      });
    }

    function removeCurrentWinner() {
      if (!currentWinner) return;

      const input = document.getElementById('nameInput');
      const lines = input.value.split('\n').map(l => l.trim());
      const newLines = lines.filter(l => l !== currentWinner.title);
      input.value = newLines.join('\n');

      parseNames();
      showToast(`Đã xóa "${currentWinner.title}" khỏi danh sách`);
      modal.classList.remove('active');
    }

    // --- WHEEL RENDERING ---
    function drawWheel() {
      const data = nameList;

      if (data.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "20px Arial";
        ctx.fillStyle = "#333";
        ctx.textAlign = "center";
        ctx.fillText("Chưa có dữ liệu", canvas.width / 2, canvas.height / 2);
        return;
      }

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const totalWeight = data.reduce((sum, p) => sum + p.weight, 0);
      let currentAngle = 0;

      data.forEach(prize => {
        const sliceAngle = (prize.weight / totalWeight) * 2 * Math.PI;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = prize.color;
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(currentAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 18px Arial";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 4;

        let text = prize.title;
        if (text.length > 15) text = text.substring(0, 12) + "...";
        ctx.fillText(text, radius - 20, 5);

        ctx.restore();
        currentAngle += sliceAngle;
      });

      ctx.beginPath();
      ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.stroke();
    }

    // --- SPIN LOGIC ---
    function spin() {
      if (isSpinning) return;
      const data = nameList;

      if (data.length < 2) {
        alert("Cần ít nhất 2 mục để quay!");
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isSpinning = true;
      spinBtn.disabled = true;
      playSound("spin");

      let winnerIndex = -1;

      // Random selection
      const totalWeight = data.reduce((sum, p) => sum + p.weight, 0);
      let random = Math.random() * totalWeight;
      for (let i = 0; i < data.length; i++) {
        if (random < data[i].weight) {
          winnerIndex = i;
          break;
        }
        random -= data[i].weight;
      }

      const startWeight = data.slice(0, winnerIndex).reduce((sum, p) => sum + p.weight, 0);

      const sliceAngle = (data[winnerIndex].weight / totalWeight) * 360;
      const startAngle = (startWeight / totalWeight) * 360;
      const centerAngle = startAngle + sliceAngle / 2;

      const minSpins = 5;
      const baseRotation = 360 * minSpins;

      let targetRotation = 270 - centerAngle;
      while (targetRotation < currentRotation + baseRotation) {
        targetRotation += 360;
      }
      const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.8);
      targetRotation += randomOffset;

      const duration = 5000;
      const startTime = performance.now();
      const startRotation = currentRotation;

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 4);

        currentRotation = startRotation + (targetRotation - startRotation) * ease;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          endSpin(winnerIndex);
        }
      }
      requestAnimationFrame(animate);
    }

    function endSpin(winnerIndex) {
      isSpinning = false;
      spinBtn.disabled = false;

      const data = nameList;
      const winner = data[winnerIndex];
      currentWinner = winner;

      playSound("win");
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      document.getElementById('modalTitle').textContent = winner.title;

      // Add to history
      history.push(winner.title);
      localStorage.setItem('lucky_spin_history', JSON.stringify(history));
      updateHistoryUI();

      modal.classList.add('active');

      // Auto spin logic
      if (window.autoSpinCount && window.autoSpinCount > 0) {
        window.autoSpinCount--;
        setTimeout(() => {
          modal.classList.remove('active');
          if (window.autoSpinCount > 0) spin();
        }, 2000);
      }
    }

    // --- UTILS ---
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // --- AUDIO SYSTEM ---
    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (type === "spin") {
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === "win") {
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(0.1, now + 0.1 + i * 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, now + 2);
          o.start(now);
          o.stop(now + 2);
        });
      }
    }

    // --- EVENT LISTENERS ---
    function setupEventListeners() {
      spinBtn.addEventListener('click', spin);

      // Name Mode Events
      document.getElementById('updateNameWheelBtn').addEventListener('click', parseNames);
      document.getElementById('nameInput').addEventListener('input', parseNames); // Auto render

      document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        if (confirm("Xóa toàn bộ lịch sử?")) {
          history = [];
          localStorage.removeItem('lucky_spin_history');
          updateHistoryUI();
        }
      });

      // Modal Buttons
      document.getElementById('keepWinnerBtn').addEventListener('click', () => {
        modal.classList.remove('active');
      });
      document.getElementById('removeWinnerBtn').addEventListener('click', removeCurrentWinner);

      // Common Events
      document.getElementById('toggleSoundBtn').addEventListener('click', function () {
        soundEnabled = !soundEnabled;
        this.textContent = soundEnabled ? "🔊 Bật âm thanh" : "🔇 Tắt âm thanh";
      });

      document.getElementById('autoSpinBtn').addEventListener('click', () => {
        const count = prompt("Nhập số lần quay tự động:", "5");
        if (count && !isNaN(count)) {
          window.autoSpinCount = parseInt(count);
          spin();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          if (modal.classList.contains('active')) {
            // Do nothing or close?
          } else if (!isSpinning && document.activeElement.tagName !== 'TEXTAREA') {
            spin();
          }
        }
        if (e.code === 'Escape') {
          modal.classList.remove('active');
        }
      });
    }

    // Run
    window.addEventListener('load', init);
  </script>
</body>

</html>
