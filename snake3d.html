<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐍 Rắn Săn Mồi 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka One', cursive;
      background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 1000px;
    }

    .game-board {
      width: 600px;
      height: 600px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateX(15deg);
      background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
      border: 4px solid #00ffff;
      border-radius: 20px;
      box-shadow:
        0 0 50px #00ffff,
        inset 0 0 50px rgba(0, 255, 255, 0.1);
      animation: boardGlow 3s ease-in-out infinite alternate;
    }

    @keyframes boardGlow {
      0% {
        box-shadow: 0 0 50px #00ffff, inset 0 0 50px rgba(0, 255, 255, 0.1);
      }

      100% {
        box-shadow: 0 0 80px #ff00ff, inset 0 0 50px rgba(255, 0, 255, 0.1);
      }
    }

    .snake-segment {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: 0 0 20px currentColor;
      transition: all 0.1s ease;
      animation: segmentPulse 1s ease-in-out infinite alternate;
    }

    @keyframes segmentPulse {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.1);
      }
    }

    .snake-head {
      background: radial-gradient(circle, #ff6b6b, #ff3333);
      color: #ff3333;
      z-index: 10;
    }

    .snake-head::before {
      content: '👀';
      position: absolute;
      top: -2px;
      left: 2px;
      font-size: 12px;
    }

    .food {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffeb3b, #ffc107);
      box-shadow: 0 0 25px #ffeb3b;
      animation: foodFloat 2s ease-in-out infinite;
    }

    .food::before {
      content: '🍎';
      position: absolute;
      top: -2px;
      left: -1px;
      font-size: 16px;
    }

    @keyframes foodFloat {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-5px) scale(1.1);
      }
    }

    .ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffff;
      font-size: 24px;
      text-shadow: 0 0 10px #00ffff;
      z-index: 100;
    }

    .menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .menu h1 {
      font-size: 48px;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff;
      margin-bottom: 40px;
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      0% {
        color: #00ffff;
        text-shadow: 0 0 20px #00ffff;
      }

      100% {
        color: #ff00ff;
        text-shadow: 0 0 20px #ff00ff;
      }
    }

    .menu-button {
      background: linear-gradient(45deg, #ff6b6b, #ff3333);
      border: none;
      padding: 15px 30px;
      margin: 10px;
      border-radius: 25px;
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
      transition: all 0.3s ease;
    }

    .menu-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
    }

    .difficulty-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .easy-mode {
      background: linear-gradient(45deg, #4caf50, #45a049);
    }

    .normal-mode {
      background: linear-gradient(45deg, #ff9800, #f57c00);
    }

    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: #ff6b6b;
      border: 3px solid #ff6b6b;
      box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
      z-index: 1000;
      display: none;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffff;
      text-align: center;
      font-size: 16px;
      text-shadow: 0 0 10px #00ffff;
    }

    .speed-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #ff00ff;
      font-size: 18px;
      text-shadow: 0 0 10px #ff00ff;
    }

    @media (max-width: 768px) {
      .game-board {
        width: 90vw;
        height: 90vw;
        max-width: 500px;
        max-height: 500px;
      }

      .menu h1 {
        font-size: 36px;
      }

      .menu-button {
        font-size: 18px;
        padding: 12px 24px;
      }
    }
  </style>
</head>

<body>
  <div class="game-container">
    <div class="menu" id="menu">
      <h1>🐍 RẮN SĂN MỒI 3D 🌟</h1>
      <button class="menu-button" onclick="startGame()">🎮 BẮT ĐẦU CHƠI</button>
      <div class="difficulty-buttons">
        <button class="menu-button easy-mode" onclick="setDifficulty('easy')">😊 DỄ (Cho bé)</button>
        <button class="menu-button normal-mode" onclick="setDifficulty('normal')">🔥 BÌNH THƯỜNG</button>
      </div>
      <div style="margin-top: 30px; color: #00ffff; font-size: 16px; text-align: center;">
        <p>🎯 Ăn trái cây để rắn dài ra!</p>
        <p>⚡ Mỗi 5 điểm tốc độ sẽ tăng!</p>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="ui">
      <div>🏆 Điểm: <span id="score">0</span></div>
      <div>🍎 Mục tiêu: <span id="nextSpeedUp">5</span></div>
    </div>

    <div class="speed-indicator">
      ⚡ Tốc độ: <span id="speedLevel">1.0x</span>
    </div>

    <div class="controls">
      <p>🎮 Điều khiển: ← → ↑ ↓ hoặc WASD</p>
      <p>📱 Di động: Vuốt màn hình</p>
    </div>

    <div class="game-over" id="gameOver">
      <h2>🎮 GAME OVER! 🎮</h2>
      <p>Điểm của bạn: <span id="finalScore">0</span></p>
      <button class="menu-button" onclick="restartGame()">🔄 CHƠI LẠI</button>
      <button class="menu-button" onclick="backToMenu()">🏠 MENU CHÍNH</button>
    </div>
  </div>

  <script>
    class SnakeGame3D {
      constructor() {
        this.board = document.getElementById('gameBoard');
        this.boardSize = 30;
        this.cellSize = 20;
        this.snake = [{ x: 15, y: 15 }];
        this.direction = { x: 1, y: 0 };
        this.food = this.generateFood();
        this.score = 0;
        this.baseSpeed = 200;
        this.currentSpeed = this.baseSpeed;
        this.speedMultiplier = 5.0;
        this.gameRunning = false;
        this.difficulty = 'normal';
        this.colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];
        this.colorIndex = 0;

        this.setupEventListeners();
        this.setupTouchControls();
      }

      setupEventListeners() {
        document.addEventListener('keydown', (e) => {
          if (!this.gameRunning) return;

          const key = e.key.toLowerCase();
          switch (key) {
            case 'arrowup':
            case 'w':
              if (this.direction.y !== 1) this.direction = { x: 0, y: -1 };
              break;
            case 'arrowdown':
            case 's':
              if (this.direction.y !== -1) this.direction = { x: 0, y: 1 };
              break;
            case 'arrowleft':
            case 'a':
              if (this.direction.x !== 1) this.direction = { x: -1, y: 0 };
              break;
            case 'arrowright':
            case 'd':
              if (this.direction.x !== -1) this.direction = { x: 1, y: 0 };
              break;
          }
        });
      }

      setupTouchControls() {
        let touchStartX = 0;
        let touchStartY = 0;

        this.board.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        });

        this.board.addEventListener('touchend', (e) => {
          if (!this.gameRunning) return;

          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;

          const deltaX = touchEndX - touchStartX;
          const deltaY = touchEndY - touchStartY;

          if (Math.abs(deltaX) > Math.abs(deltaY)) {
            if (deltaX > 30 && this.direction.x !== -1) {
              this.direction = { x: 1, y: 0 };
            } else if (deltaX < -30 && this.direction.x !== 1) {
              this.direction = { x: -1, y: 0 };
            }
          } else {
            if (deltaY > 30 && this.direction.y !== -1) {
              this.direction = { x: 0, y: 1 };
            } else if (deltaY < -30 && this.direction.y !== 1) {
              this.direction = { x: 0, y: -1 };
            }
          }
        });
      }

      generateFood() {
        let newFood;
        do {
          newFood = {
            x: Math.floor(Math.random() * this.boardSize),
            y: Math.floor(Math.random() * this.boardSize)
          };
        } while (this.snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
        return newFood;
      }

      update() {
        if (!this.gameRunning) return;

        const head = { ...this.snake[0] };
        head.x += this.direction.x;
        head.y += this.direction.y;

        // Check wall collision
        if (head.x < 0 || head.x >= this.boardSize || head.y < 0 || head.y >= this.boardSize) {
          this.gameOver();
          return;
        }

        // Check self collision (only in normal mode)
        if (this.difficulty === 'normal' && this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
          this.gameOver();
          return;
        }

        this.snake.unshift(head);

        // Check food collision
        if (head.x === this.food.x && head.y === this.food.y) {
          this.score++;
          this.playEatSound();
          this.food = this.generateFood();
          this.updateScore();

          // Increase speed every 5 points
          if (this.score % 5 === 0) {
            this.speedMultiplier += 5;
            this.currentSpeed = this.baseSpeed / this.speedMultiplier;
            this.playSpeedUpSound();
            this.updateSpeedDisplay();
          }
        } else {
          this.snake.pop();
        }

        this.render();
      }

      render() {
        this.board.innerHTML = '';

        // Render snake
        this.snake.forEach((segment, index) => {
          const segmentElement = document.createElement('div');
          segmentElement.className = index === 0 ? 'snake-segment snake-head' : 'snake-segment';
          segmentElement.style.left = segment.x * this.cellSize + 'px';
          segmentElement.style.top = segment.y * this.cellSize + 'px';

          if (index > 0) {
            const colorIndex = (index - 1) % this.colors.length;
            const color = this.colors[colorIndex];
            segmentElement.style.background = `radial-gradient(circle, ${color}, ${color}dd)`;
            segmentElement.style.color = color;
          }

          this.board.appendChild(segmentElement);
        });

        // Render food
        const foodElement = document.createElement('div');
        foodElement.className = 'food';
        foodElement.style.left = this.food.x * this.cellSize + 'px';
        foodElement.style.top = this.food.y * this.cellSize + 'px';
        this.board.appendChild(foodElement);
      }

      updateScore() {
        document.getElementById('score').textContent = this.score;
        const nextTarget = Math.ceil((this.score + 1) / 5) * 5;
        document.getElementById('nextSpeedUp').textContent = nextTarget;
      }

      updateSpeedDisplay() {
        document.getElementById('speedLevel').textContent = this.speedMultiplier.toFixed(1) + 'x';
      }

      playEatSound() {
        // Create a simple beep sound using Web Audio API
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.2);
      }

      playSpeedUpSound() {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.3);
      }

      start() {
        this.gameRunning = true;
        this.gameLoop = setInterval(() => this.update(), this.currentSpeed);
        this.render();
      }

      stop() {
        this.gameRunning = false;
        if (this.gameLoop) {
          clearInterval(this.gameLoop);
        }
      }

      reset() {
        this.snake = [{ x: 15, y: 15 }];
        this.direction = { x: 1, y: 0 };
        this.food = this.generateFood();
        this.score = 0;
        this.speedMultiplier = 1.0;
        this.currentSpeed = this.baseSpeed;
        this.updateScore();
        this.updateSpeedDisplay();
      }

      gameOver() {
        this.stop();
        document.getElementById('finalScore').textContent = this.score;
        document.getElementById('gameOver').style.display = 'block';
      }

      setDifficulty(difficulty) {
        this.difficulty = difficulty;
      }
    }

    const game = new SnakeGame3D();

    function startGame() {
      document.getElementById('menu').style.display = 'none';
      game.reset();
      game.start();
    }

    function setDifficulty(difficulty) {
      game.setDifficulty(difficulty);
      const buttons = document.querySelectorAll('.difficulty-buttons .menu-button');
      buttons.forEach(btn => btn.style.transform = 'scale(1)');
      event.target.style.transform = 'scale(1.1)';

      if (difficulty === 'easy') {
        alert('🌟 Chế độ DỄ: Rắn không chết khi va vào thân mình!');
      } else {
        alert('🔥 Chế độ BÌNH THƯỜNG: Cẩn thận không để rắn va vào thân mình!');
      }
    }

    function restartGame() {
      document.getElementById('gameOver').style.display = 'none';
      game.reset();
      game.start();
    }

    function backToMenu() {
      document.getElementById('gameOver').style.display = 'none';
      document.getElementById('menu').style.display = 'flex';
      game.stop();
    }

    // Background music simulation with Web Audio API
    function playBackgroundMusic() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();

      function playNote(frequency, duration, delay = 0) {
        setTimeout(() => {
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);

          oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
          gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + duration);
        }, delay);
      }

      // Simple melody loop
      const melody = [523, 587, 659, 698, 784, 698, 659, 587];
      let noteIndex = 0;

      setInterval(() => {
        if (game.gameRunning) {
          playNote(melody[noteIndex], 0.3);
          noteIndex = (noteIndex + 1) % melody.length;
        }
      }, 800);
    }

    // Start background music when user interacts
    document.addEventListener('click', playBackgroundMusic, { once: true });
    document.addEventListener('keydown', playBackgroundMusic, { once: true });
  </script>
