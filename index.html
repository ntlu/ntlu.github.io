<!doctype html>
<html lang="vi" style="height: 100%;">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Banner</title>
    <script src="/_sdk/element_sdk.js"></script>
    <style>
        /* --- Background + ambient effects (kept from original) --- */
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Arial', sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460, #533483);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            position: relative;
            color: #fff;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 0
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                transform: scale(1);
            }

            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* --- Main floating GAME title --- */
        .game-text {
            position: absolute;
            left: 50%;
            top: 8%;
            transform: translateX(-50%);
            font-size: 5rem;
            font-weight: 900;
            color: #ff6b6b;
            text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b, 0 0 60px #ff6b6b, 0 0 80px #ff6b6b;
            letter-spacing: 0.2em;
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateX(-50%) translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateX(-50%) translateY(-12px) rotate(2deg);
            }
        }

        .game-text:hover {
            transform: translateX(-50%) scale(1.05);
            color: #4ecdc4;
        }

        /* --- Glow orbs + particles --- */
        .glow-orb {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.28) 0%, transparent 70%);
            animation: orbFloat 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 1
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(200px, -100px) scale(1.2);
            }

            66% {
                transform: translate(-150px, 100px) scale(0.8);
            }
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b6b;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 4s linear infinite;
            z-index: 1
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100%) rotate(0deg);
                opacity: 1
            }

            100% {
                transform: translateY(-100%) rotate(360deg);
                opacity: 0
            }
        }

        /* --- Lightning --- */
        .lightning {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, #fff, transparent);
            animation: lightning 0.1s ease-in-out;
            opacity: 0;
            z-index: 1
        }

        @keyframes lightning {

            0%,
            100% {
                opacity: 0
            }

            50% {
                opacity: 1
            }
        }

        /* --- New: Game list panel --- */
        .games-panel {
            position: absolute;
            right: 32px;
            top: 10px;
            width: 360px;
            max-height: calc(100% - 50px);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            overflow-y: auto;
            z-index: 30;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px
        }

        .panel-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff
        }

        .panel-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75)
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5)
        }

        .game-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.05rem
        }

        .game-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff
        }

        .game-desc {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
            text-align: center
        }

        .footer-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: space-between
        }

        .btn {
            padding: 8px 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700
        }

        .btn.primary {
            background: linear-gradient(90deg, #ff6b6b, #ff8a80);
            color: #fff
        }

        .btn.ghost {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06)
        }

        /* responsive */
        @media (max-width: 900px) {
            .games-panel {
                right: 12px;
                left: 12px;
                top: auto;
                bottom: 18px;
                width: auto;
                max-height: 48%;
            }

            .game-text {
                font-size: 3.2rem;
                top: 6%
            }

            .games-grid {
                grid-template-columns: 1fr 1fr
            }
        }
    </style>
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
    <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
</head>

<body>
    <div class="stars" id="stars"></div>

    <div class="game-text" id="gameText">GAME</div>

    <div class="glow-orb" style="top: 20%; left: 10%;"></div>
    <div class="glow-orb" style="top: 60%; right: 15%; animation-delay: -2s;"></div>
    <div class="glow-orb" style="top: 80%; left: 70%; animation-delay: -4s;"></div>

    <!-- Games panel -->
    <aside class="games-panel" id="gamesPanel" aria-label="Danh sách trò chơi">
        <div class="panel-header">
            <div>
                <div class="panel-title">Trò chơi</div>
            </div>
            <div>
                <div class="panel-sub">Chọn một trò chơi để khởi động</div>
            </div>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- cards injected by JS -->
        </div>

        <div class="footer-actions">
            <button id="shuffleGames" class="btn ghost">Đổi vị trí</button>
            <button id="moreBtn" class="btn primary">Thêm trò mới</button>
        </div>
    </aside>

    <script>
        // Danh sách game dễ chỉnh sửa: thêm / sửa / xóa ở đây
        // Lưu ý: `link` là đường dẫn khi click vào (ví dụ "./covua")
        const GAMES_LIST = [
            { game: "Đoán số", link: "./doanso.html", desc: "Đoán số", color: "#ff6b6b" },
            { game: "Đố Vui", link: "./dovui.html", desc: "Đố Vui", color: "#4ecdc4" },
            { game: "Ghép hình", link: "./ghephinh.html", desc: "Ghép hình", color: "#ff8a80" },
            { game: "làm toán 1", link: "./lamtoan1.html", desc: "làm toán 1", color: "#ff8a80" },
            { game: "Mê Cung", link: "./mecung.html", desc: "Mê Cung", color: "#ff8a80" },
            { game: "Rắn săn mồi 1", link: "./snake.html", desc: "Rắn săn mồi 1", color: "#ff8a80" },
            { game: "rắn săn mồi 2", link: "./snake2.html", desc: "rắn săn mồi 2", color: "#ff8a80" },
            { game: "rắn săn mồi 3D", link: "./snake3d.html", desc: "rắn săn mồi 3D", color: "#ff8a80" },
            { game: "Thoát khỏi mê cung", link: "./thoatkhoimecung.html", desc: "Thoát khỏi mê cung", color: "#ff8a80" },
            { game: "Tìm Bóng", link: "./timbong.html", desc: "Tìm Bóng", color: "#ff8a80" },
            { game: "Vượt chướng ngại vật", link: "./vcnv.html", desc: "Vượt chướng ngại vật", color: "#ff8a80" },
            { game: "Xếp số", link: "./xepso.html", desc: "Xếp số", color: "#ff8a80" },
            { game: "Quay số may mắn", link: "./spin2.html", desc: "Lucky Draw cao cấp", color: "#00f2fe" },
            { game: "Flappy Bird", link: "./flappybird.html", desc: "Game bay qua ống nước", color: "#ffbe0b" },
            // bạn có thể thêm nhiều mục nữa
        ];

        // internal array (có thể thay đổi thứ tự khi shuffle)
        let GAMES = GAMES_LIST.slice();

        // Khởi tạo panel từ GAMES (được gọi khi DOM sẵn sàng)
        function initGamesPanel() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            // render mỗi game từ GAMES
            GAMES.forEach(g => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');

                // click -> mở link (hoặc chuyển trang)
                card.addEventListener('click', () => openGame(g.link, g.game));
                card.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') openGame(g.link, g.game);
                });

                const icon = document.createElement('div');
                icon.className = 'game-icon';
                // Icon hiển thị chữ đầu của tên game, hoặc bạn có thể dùng ảnh
                const short = (g.game || '').split(' ').map(s => s[0]).slice(0, 2).join('');
                icon.textContent = short;
                icon.style.background = `linear-gradient(180deg, ${g.color || '#888'}, rgba(0,0,0,0.06))`;

                const name = document.createElement('div');
                name.className = 'game-name';
                name.textContent = g.game;

                const desc = document.createElement('div');
                desc.className = 'game-desc';
                desc.textContent = g.desc || '';

                card.appendChild(icon);
                card.appendChild(name);
                card.appendChild(desc);

                grid.appendChild(card);
            });

            // footer buttons (shuffle / add)
            const shuffleBtn = document.getElementById('shuffleGames');
            const moreBtn = document.getElementById('moreBtn');

            if (shuffleBtn) {
                shuffleBtn.onclick = () => {
                    shuffleArray(GAMES);
                    initGamesPanel(); // render lại
                };
            }
            if (moreBtn) {
                moreBtn.onclick = () => {
                    const title = prompt('Tên trò chơi mới:');
                    if (!title) return;
                    const link = prompt('Đường dẫn (ví dụ ./mygame):', `./game${GAMES.length + 1}`) || `./game${GAMES.length + 1}`;
                    const desc = prompt('Mô tả ngắn (tuỳ chọn):', 'Mới') || 'Mới';
                    const color = '#' + Math.floor(Math.random() * 16777215).toString(16);
                    // thêm vào mảng GAMES và render lại
                    GAMES.push({ game: title, link, desc, color });
                    initGamesPanel();
                };
            }
        }

        // Mở game: chuyển trang đến link (và có toast)
        function openGame(link, name) {
            showToast(`Đang mở ${name || link}...`);
            // nếu bạn muốn mở trong tab mới: window.open(link, '_blank')
            setTimeout(() => { window.location.href = link; }, 350);
        }

        // Shuffle helper
        function shuffleArray(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
        }

        // Toast (giữ nguyên)
        function showToast(msg) {
            let t = document.getElementById('toastDiv');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toastDiv';
                t.style.position = 'fixed';
                t.style.left = '50%';
                t.style.top = '8%';
                t.style.transform = 'translateX(-50%)';
                t.style.background = 'rgba(0,0,0,0.6)';
                t.style.padding = '10px 16px';
                t.style.borderRadius = '10px';
                t.style.zIndex = 60;
                t.style.color = '#fff';
                t.style.pointerEvents = 'none';
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.opacity = '1';
            t.style.transition = 'opacity .6s';
            setTimeout(() => { t.style.opacity = '0'; }, 1200);
        }

        // Khởi tạo sau khi DOM sẵn sàng (giữ nguyên phần còn lại của script)
        document.addEventListener('DOMContentLoaded', () => {
            // nếu bạn muốn override GAMES từ external source: GAMES = [...GAMES_LIST, ...] v.v.
            // GAMES = GAMES_LIST.slice(); // đã khởi tạo ở trên
            initGamesPanel();
            // các khởi tạo khác (stars, particles...) đã gọi ở chỗ khác trong file
        });
    </script>

</body>

</html>
