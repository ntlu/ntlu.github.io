<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Ghép Hình Theo Trí Nhớ - Gắn Kết Đội Nhóm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .card {
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .matched {
            opacity: 0.6;
            pointer-events: none;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .celebration {
            animation: celebration 0.8s ease-out;
        }

        @keyframes celebration {
            0% {
                transform: scale(1) rotate(0deg);
            }

            25% {
                transform: scale(1.1) rotate(-5deg);
            }

            50% {
                transform: scale(1.2) rotate(5deg);
            }

            75% {
                transform: scale(1.1) rotate(-2deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        @media (max-width: 768px) {
            .game-header {
                display: none !important;
            }
        }

        .back-home {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: white;
            padding: 8px 12px;
            border-radius: 9999px;
            text-decoration: none;
            color: #d946ef;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-400 via-pink-500 to-red-500 min-h-screen">
    <a href="index.html" class="back-home">🏠 Trang chủ</a>
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-6 md:mb-8 game-header">
            <div
                class="bg-white/10 backdrop-blur-lg rounded-3xl p-4 md:p-8 mx-auto max-w-2xl shadow-2xl border border-white/20">
                <h1 class="text-3xl md:text-5xl font-bold text-white mb-2 md:mb-3 drop-shadow-lg">🧩 Trò Chơi Ghép Hình
                </h1>
                <h2 class="text-xl md:text-3xl font-semibold text-white/95 mb-3 md:mb-4 drop-shadow-md">Theo Trí Nhớ
                </h2>
                <div
                    class="bg-gradient-to-r from-yellow-400/20 to-orange-400/20 backdrop-blur-sm rounded-2xl p-3 md:p-4 border border-yellow-300/30">
                    <p class="text-white font-medium text-sm md:text-lg">✨ Tìm các cặp emoji giống nhau và khám phá câu
                        hỏi thú vị! ✨</p>
                    <p class="text-white/80 text-xs md:text-sm mt-1 md:mt-2">Gắn kết đội nhóm qua trò chơi tương tác</p>
                </div>
            </div>
        </div>

        <!-- Level Selection -->
        <div class="text-center mb-6 md:mb-8">
            <div
                class="bg-white/10 backdrop-blur-lg rounded-2xl p-4 md:p-6 mx-auto max-w-4xl shadow-xl border border-white/20">
                <h3 class="text-white text-lg md:text-xl font-bold mb-4 md:mb-6 drop-shadow-md">🎯 Chọn Cấp Độ Thử Thách
                </h3>
                <div class="grid grid-cols-2 md:flex md:justify-center gap-2 md:gap-4">
                    <button
                        class="level-btn bg-gradient-to-br from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white px-3 md:px-6 py-3 md:py-4 rounded-xl font-bold transition-all transform hover:scale-105 shadow-lg"
                        data-level="1">
                        <div class="text-sm md:text-lg">🌱 Level 1</div>
                        <div class="text-xs opacity-90">Dễ - 6 cặp</div>
                    </button>
                    <button
                        class="level-btn bg-gradient-to-br from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white px-3 md:px-6 py-3 md:py-4 rounded-xl font-bold transition-all transform hover:scale-105 shadow-lg"
                        data-level="2">
                        <div class="text-sm md:text-lg">🌊 Level 2</div>
                        <div class="text-xs opacity-90">TB - 8 cặp</div>
                    </button>
                    <button
                        class="level-btn bg-gradient-to-br from-yellow-400 to-yellow-600 hover:from-yellow-500 hover:to-yellow-700 text-white px-3 md:px-6 py-3 md:py-4 rounded-xl font-bold transition-all transform hover:scale-105 shadow-lg"
                        data-level="3">
                        <div class="text-sm md:text-lg">⚡ Level 3</div>
                        <div class="text-xs opacity-90">Khó - 10 cặp</div>
                    </button>
                    <button
                        class="level-btn bg-gradient-to-br from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 text-white px-3 md:px-6 py-3 md:py-4 rounded-xl font-bold transition-all transform hover:scale-105 shadow-lg"
                        data-level="4">
                        <div class="text-sm md:text-lg">🔥 Level 4</div>
                        <div class="text-xs opacity-90">Rất khó - 12 cặp</div>
                    </button>
                    <button
                        class="level-btn bg-gradient-to-br from-red-400 to-red-600 hover:from-red-500 hover:to-red-700 text-white px-3 md:px-6 py-3 md:py-4 rounded-xl font-bold transition-all transform hover:scale-105 shadow-lg col-span-2 md:col-span-1"
                        data-level="5">
                        <div class="text-sm md:text-lg">💀 Level 5</div>
                        <div class="text-xs opacity-90">Cực khó - 15 cặp</div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Stats -->
        <div class="grid grid-cols-2 md:flex md:justify-center gap-2 md:gap-4 mb-6 md:mb-8">
            <div
                class="bg-gradient-to-br from-purple-500/30 to-pink-500/30 backdrop-blur-lg rounded-2xl px-3 md:px-6 py-3 md:py-4 shadow-lg border border-white/20">
                <div class="text-white text-center">
                    <div class="text-2xl md:text-3xl font-bold drop-shadow-md" id="currentLevel">1</div>
                    <div class="text-xs md:text-sm font-medium opacity-90">🎯 Level</div>
                </div>
            </div>
            <div
                class="bg-gradient-to-br from-blue-500/30 to-cyan-500/30 backdrop-blur-lg rounded-2xl px-3 md:px-6 py-3 md:py-4 shadow-lg border border-white/20">
                <div class="text-white text-center">
                    <div class="text-2xl md:text-3xl font-bold drop-shadow-md" id="moves">0</div>
                    <div class="text-xs md:text-sm font-medium opacity-90">👆 Lượt chơi</div>
                </div>
            </div>
            <div
                class="bg-gradient-to-br from-green-500/30 to-emerald-500/30 backdrop-blur-lg rounded-2xl px-3 md:px-6 py-3 md:py-4 shadow-lg border border-white/20">
                <div class="text-white text-center">
                    <div class="text-2xl md:text-3xl font-bold drop-shadow-md" id="matches">0/6</div>
                    <div class="text-xs md:text-sm font-medium opacity-90">✅ Cặp ghép</div>
                </div>
            </div>
            <div
                class="bg-gradient-to-br from-orange-500/30 to-red-500/30 backdrop-blur-lg rounded-2xl px-3 md:px-6 py-3 md:py-4 shadow-lg border border-white/20">
                <div class="text-white text-center">
                    <div class="text-2xl md:text-3xl font-bold drop-shadow-md" id="timer">00:00</div>
                    <div class="text-xs md:text-sm font-medium opacity-90">⏱️ Thời gian</div>
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="max-w-4xl mx-auto mb-6 md:mb-8 px-2">
            <div class="grid grid-cols-4 gap-2 md:gap-4" id="gameBoard">
                <!-- Cards will be generated here -->
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="text-center mb-6 md:mb-8">
            <div class="flex justify-center gap-3 md:gap-4 flex-wrap px-4">
                <button id="resetBtn"
                    class="bg-gradient-to-r from-white to-gray-100 text-purple-700 font-bold px-4 md:px-8 py-3 md:py-4 rounded-2xl hover:from-gray-100 hover:to-gray-200 transition-all transform hover:scale-105 shadow-xl border-2 border-white/50 text-sm md:text-base">
                    🔄 Chơi lại
                </button>
                <button id="questionBtn"
                    class="bg-gradient-to-r from-yellow-400 to-orange-400 text-white font-bold px-4 md:px-8 py-3 md:py-4 rounded-2xl hover:from-yellow-500 hover:to-orange-500 transition-all transform hover:scale-105 shadow-xl border-2 border-yellow-300/50 text-sm md:text-base">
                    💬 Câu hỏi ngẫu nhiên
                </button>
            </div>
        </div>

        <!-- Question Modal -->
        <div id="questionModal"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full text-center">
                <div class="text-3xl md:text-4xl mb-3 md:mb-4">💭</div>
                <h3 class="text-lg md:text-xl font-bold text-gray-800 mb-3 md:mb-4">Câu hỏi khởi động</h3>
                <p id="questionText" class="text-gray-600 mb-4 md:mb-6 leading-relaxed text-sm md:text-base"></p>
                <button id="closeQuestion"
                    class="bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600 transition-colors">
                    Đóng
                </button>
            </div>
        </div>

        <!-- Victory Modal -->
        <div id="victoryModal"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl p-6 md:p-8 max-w-md w-full text-center celebration">
                <div class="text-5xl md:text-6xl mb-3 md:mb-4">🎉</div>
                <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3 md:mb-4">Chúc mừng!</h3>
                <p class="text-gray-600 mb-2 text-sm md:text-base">Bạn đã hoàn thành trò chơi!</p>
                <p id="finalStats" class="text-gray-600 mb-4 md:mb-6 text-sm md:text-base"></p>
                <div class="flex gap-2 md:gap-3 justify-center flex-wrap">
                    <button id="playAgain"
                        class="bg-purple-500 text-white px-4 md:px-6 py-2 rounded-lg hover:bg-purple-600 transition-colors text-sm md:text-base">
                        Chơi lại
                    </button>
                    <button id="newQuestion"
                        class="bg-yellow-400 text-gray-800 px-4 md:px-6 py-2 rounded-lg hover:bg-yellow-300 transition-colors text-sm md:text-base">
                        Câu hỏi mới
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game data - Extended emoji sets for different levels
        const allEmojis = [
            '💼', '💻', '☕', '📊', '🎯', '💡', // Level 1: 6 pairs
            '📝', '🖥️', // Level 2: +2 pairs = 8 pairs
            '📱', '🖨️', // Level 3: +2 pairs = 10 pairs  
            '📋', '🗂️', // Level 4: +2 pairs = 12 pairs
            '📌', '🔍', '📧', '💬', '🎨', '⚙️' // Level 5: +6 pairs = 15 pairs total
        ];
        const conversationStarters = [
            "Emoji nào mô tả đúng buổi sáng của bạn nhất?",
            "Bạn làm việc hiệu quả nhất vào thời gian nào trong ngày?",
            "Điều gì khiến bạn cảm thấy hứng thú nhất trong công việc?",
            "Bạn thích làm việc nhóm hay độc lập hơn? Tại sao?",
            "Kỹ năng mềm nào bạn nghĩ quan trọng nhất trong môi trường làm việc?",
            "Bạn thường xử lý căng thẳng công việc như thế nào?",
            "Thành tựu công việc nào gần đây khiến bạn tự hào nhất?",
            "Bạn học hỏi điều mới tốt nhất qua cách nào?",
            "Điều gì tạo động lực cho bạn mỗi ngày đến văn phòng?",
            "Bạn tự hào về kỹ năng làm việc nào mà mình đã phát triển?"
        ];

        // Game state
        let gameState = {
            cards: [],
            flippedCards: [],
            matches: 0,
            moves: 0,
            startTime: null,
            timer: null,
            gameComplete: false,
            currentLevel: 1,
            totalPairs: 6
        };

        // Initialize game
        function initGame(level = gameState.currentLevel) {
            // Calculate pairs for level
            let pairsCount;
            if (level === 5) {
                pairsCount = 15; // Level 5: 15 pairs
            } else {
                pairsCount = 4 + (level * 2); // Level 1: 6, Level 2: 8, Level 3: 10, Level 4: 12
            }

            // Reset game state
            gameState = {
                cards: [],
                flippedCards: [],
                matches: 0,
                moves: 0,
                startTime: null,
                timer: null,
                gameComplete: false,
                currentLevel: level,
                totalPairs: pairsCount
            };

            // Get emojis for current level
            const levelEmojis = allEmojis.slice(0, pairsCount);
            const cardPairs = [...levelEmojis, ...levelEmojis];

            gameState.cards = shuffleArray(cardPairs.map((emoji, index) => ({
                id: index,
                emoji: emoji,
                matched: false,
                flipped: false
            })));

            // Update level buttons
            updateLevelButtons();

            // Render game board
            renderGameBoard();
            updateStats();

            // Clear timer
            if (gameState.timer) {
                clearInterval(gameState.timer);
            }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function updateLevelButtons() {
            const levelButtons = document.querySelectorAll('.level-btn');
            levelButtons.forEach(btn => {
                const level = parseInt(btn.dataset.level);
                if (level === gameState.currentLevel) {
                    btn.classList.add('ring-4', 'ring-white', 'ring-opacity-70', 'scale-110');
                } else {
                    btn.classList.remove('ring-4', 'ring-white', 'ring-opacity-70', 'scale-110');
                }
            });
        }

        function renderGameBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';

            // Adjust grid columns based on level
            const totalCards = gameState.totalPairs * 2;
            let gridCols = 'grid-cols-4';
            if (totalCards > 21) gridCols = 'grid-cols-6';
            else if (totalCards > 16) gridCols = 'grid-cols-5';

            gameBoard.className = `grid ${gridCols} gap-2 md:gap-4`;

            gameState.cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = `card h-16 md:h-24 ${card.matched ? 'matched' : ''}`;
                cardElement.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front bg-gradient-to-br from-blue-400 to-purple-500 shadow-lg">
                            <span class="text-white text-lg md:text-2xl">🎯</span>
                        </div>
                        <div class="card-back bg-white shadow-lg">
                            <span class="text-lg md:text-2xl">${card.emoji}</span>
                        </div>
                    </div>
                `;

                cardElement.addEventListener('click', () => flipCard(index));
                gameBoard.appendChild(cardElement);
            });
        }

        function flipCard(index) {
            if (gameState.gameComplete) return;
            if (gameState.cards[index].matched) return;
            if (gameState.cards[index].flipped) return;
            if (gameState.flippedCards.length >= 2) return;

            // Start timer on first move
            if (!gameState.startTime) {
                startTimer();
            }

            // Flip card
            gameState.cards[index].flipped = true;
            gameState.flippedCards.push(index);

            const cardElement = document.querySelectorAll('.card')[index];
            cardElement.classList.add('flipped');

            // Check for match
            if (gameState.flippedCards.length === 2) {
                gameState.moves++;
                setTimeout(checkMatch, 800);
            }

            updateStats();
        }

        function checkMatch() {
            const [first, second] = gameState.flippedCards;
            const firstCard = gameState.cards[first];
            const secondCard = gameState.cards[second];

            if (firstCard.emoji === secondCard.emoji) {
                // Match found
                firstCard.matched = true;
                secondCard.matched = true;
                gameState.matches++;

                const cardElements = document.querySelectorAll('.card');
                cardElements[first].classList.add('matched');
                cardElements[second].classList.add('matched');

                // Check for game completion
                if (gameState.matches === gameState.totalPairs) {
                    gameState.gameComplete = true;
                    clearInterval(gameState.timer);
                    setTimeout(showVictory, 500);
                }
            } else {
                // No match - flip back
                firstCard.flipped = false;
                secondCard.flipped = false;

                const cardElements = document.querySelectorAll('.card');
                cardElements[first].classList.remove('flipped');
                cardElements[second].classList.remove('flipped');
            }

            gameState.flippedCards = [];
            updateStats();
        }

        function startTimer() {
            gameState.startTime = Date.now();
            gameState.timer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer').textContent = `${minutes}:${seconds}`;
            }, 1000);
        }

        function updateStats() {
            document.getElementById('currentLevel').textContent = gameState.currentLevel;
            document.getElementById('moves').textContent = gameState.moves;
            document.getElementById('matches').textContent = `${gameState.matches}/${gameState.totalPairs}`;
        }

        function showVictory() {
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            document.getElementById('finalStats').textContent =
                `Hoàn thành trong ${gameState.moves} lượt chơi và ${minutes > 0 ? minutes + ' phút ' : ''}${seconds} giây!`;

            document.getElementById('victoryModal').classList.remove('hidden');
            document.getElementById('victoryModal').classList.add('flex');
        }

        function showRandomQuestion() {
            const randomQuestion = conversationStarters[Math.floor(Math.random() * conversationStarters.length)];
            document.getElementById('questionText').textContent = randomQuestion;
            document.getElementById('questionModal').classList.remove('hidden');
            document.getElementById('questionModal').classList.add('flex');
        }

        // Event listeners
        document.getElementById('resetBtn').addEventListener('click', () => initGame());
        document.getElementById('questionBtn').addEventListener('click', showRandomQuestion);

        // Level selection
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const level = parseInt(btn.dataset.level);
                initGame(level);
            });
        });

        document.getElementById('closeQuestion').addEventListener('click', () => {
            document.getElementById('questionModal').classList.add('hidden');
            document.getElementById('questionModal').classList.remove('flex');
        });
        document.getElementById('playAgain').addEventListener('click', () => {
            document.getElementById('victoryModal').classList.add('hidden');
            document.getElementById('victoryModal').classList.remove('flex');
            initGame();
        });
        document.getElementById('newQuestion').addEventListener('click', () => {
            document.getElementById('victoryModal').classList.add('hidden');
            document.getElementById('victoryModal').classList.remove('flex');
            showRandomQuestion();
        });

        // Initialize game on load
        initGame();
    </script>
