<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay May Mắn - Lucky Spin</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --accent: #ffa502;
            --bg: #f1f2f6;
            --text: #2f3542;
            --panel-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--primary);
            text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        /* Container chính */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        /* Khu vực vòng quay */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            max-width: 90vw;
            max-height: 90vw;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 0.1s;
        }

        /* Mũi tên chỉ định */
        .indicator {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            background-color: var(--primary);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Nút quay ở giữa */
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 50%;
            border: 4px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .spin-btn:disabled {
            background: #ccc;
            border-color: #999;
            color: #666;
            cursor: not-allowed;
        }

        /* Controls dưới vòng quay */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            background-color: var(--secondary);
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button.primary {
            background-color: var(--primary);
        }

        button.accent {
            background-color: var(--accent);
            color: #333;
        }

        /* Admin Panel */
        .admin-panel {
            flex: 1;
            min-width: 300px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            max-height: 80vh;
            overflow-y: auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .prize-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .prize-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 5px solid #ccc;
        }

        .prize-info {
            flex: 1;
        }

        .prize-title {
            font-weight: bold;
        }

        .prize-weight {
            font-size: 0.85em;
            color: #666;
        }

        .prize-actions {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        /* Form thêm/sửa */
        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        input[type="color"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .winner-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .winner-title {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .winner-desc {
            color: #666;
            margin-bottom: 20px;
        }

        .coupon-code {
            background: #eee;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 18px;
            margin-bottom: 20px;
            cursor: pointer;
            border: 1px dashed #999;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .wheel-container {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>Vòng Quay May Mắn</h1>

    <div class="main-container">
        <!-- Khu vực vòng quay -->
        <div class="wheel-section">
            <div class="wheel-container">
                <div class="indicator"></div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
                <button class="spin-btn" id="spinBtn">QUAY</button>
            </div>

            <div class="controls">
                <button id="toggleSoundBtn">🔊 Bật âm thanh</button>
                <button id="autoSpinBtn">🔄 Quay tự động</button>
            </div>

            <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                <label><input type="checkbox" id="riggedMode"> Chế độ Debug (Rigged)</label>
                <select id="riggedIndex" disabled style="margin-left: 5px; padding: 2px;">
                    <!-- Options will be populated by JS -->
                </select>
            </div>
        </div>

        <!-- Khu vực Admin -->
        <div class="admin-panel">
            <div class="admin-header">
                <h2>Quản lý giải thưởng</h2>
                <div>
                    <button class="btn-sm" id="exportBtn">⬇ Export</button>
                    <button class="btn-sm" id="importBtn" onclick="document.getElementById('fileInput').click()">⬆
                        Import</button>
                    <input type="file" id="fileInput" style="display: none" accept=".json">
                </div>
            </div>

            <ul class="prize-list" id="prizeList">
                <!-- Items rendered here -->
            </ul>

            <div class="edit-form">
                <h3>Thêm / Sửa giải thưởng</h3>
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Tên giải (*)</label>
                    <input type="text" id="editTitle" placeholder="Ví dụ: Voucher 100k">
                </div>
                <div class="row">
                    <div class="form-group" style="flex: 1">
                        <label>Màu sắc</label>
                        <input type="color" id="editColor" value="#ff4757">
                    </div>
                    <div class="form-group" style="flex: 1">
                        <label>Trọng số (Weight)</label>
                        <input type="number" id="editWeight" value="1" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Icon (Emoji/Text)</label>
                    <input type="text" id="editIcon" placeholder="🎁">
                </div>
                <div class="form-group">
                    <label>Mô tả / Mã Coupon</label>
                    <input type="text" id="editDesc" placeholder="Nhập mã hoặc mô tả...">
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="primary" id="savePrizeBtn" style="flex: 1">Lưu mục này</button>
                    <button id="clearFormBtn">Hủy</button>
                </div>
            </div>

            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
                <button class="accent" id="saveAllBtn" style="width: 100%">💾 Lưu cấu hình & Áp dụng</button>
                <button id="resetDefaultBtn" style="width: 100%; margin-top: 10px; background: #ff6b6b;">⚠ Reset mặc
                    định</button>
            </div>
        </div>
    </div>

    <!-- Modal Kết Quả -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-content">
            <span class="winner-icon" id="modalIcon">🎉</span>
            <h2 class="winner-title" id="modalTitle">Chúc mừng!</h2>
            <p class="winner-desc" id="modalDesc">Bạn đã trúng giải thưởng lớn.</p>

            <div id="couponContainer" style="display: none;">
                <div class="coupon-code" id="couponCode" title="Click để copy">CODE123</div>
                <p style="font-size: 0.8em; color: #888;">(Click vào mã để copy)</p>
            </div>

            <button class="primary" id="closeModalBtn" style="margin-top: 20px; width: 100%;">Tuyệt vời!</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Thông báo</div>

    <script>
        /**
         * LUCKY SPIN APP
         * 
         * Cấu trúc dữ liệu Prize:
         * {
         *   id: number,
         *   title: string,
         *   color: string (hex),
         *   weight: number (tỷ lệ xuất hiện),
         *   icon: string (emoji),
         *   description: string (optional)
         * }
         */

        // --- DEFAULT DATA ---
        const DEFAULT_PRIZES = [
            { id: 1, title: "Chúc may mắn", color: "#a4b0be", weight: 5, icon: "😢", description: "Thử lại lần sau nhé!" },
            { id: 2, title: "100 Điểm", color: "#7bed9f", weight: 3, icon: "💎", description: "Cộng 100 điểm vào tài khoản" },
            { id: 3, title: "Voucher 10%", color: "#70a1ff", weight: 2, icon: "🎟", description: "Mã: SALE10" },
            { id: 4, title: "Voucher 20%", color: "#5352ed", weight: 1, icon: "🎫", description: "Mã: SALE20" },
            { id: 5, title: "Quà bí mật", color: "#ff6b81", weight: 1, icon: "🎁", description: "Liên hệ admin để nhận quà" },
            { id: 6, title: "Thêm lượt", color: "#eccc68", weight: 2, icon: "🔄", description: "Bạn được quay thêm 1 lần" }
        ];

        // --- STATE ---
        let prizes = [];
        let isSpinning = false;
        let currentRotation = 0; // Tổng góc quay hiện tại
        let soundEnabled = true;
        let audioCtx = null;

        // --- DOM ELEMENTS ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const prizeListEl = document.getElementById('prizeList');
        const modal = document.getElementById('resultModal');

        // --- INITIALIZATION ---
        function init() {
            loadData();
            drawWheel();
            setupEventListeners();
            updateAdminUI();
            updateRiggedOptions();
        }

        // --- DATA MANAGEMENT ---
        function loadData() {
            const saved = localStorage.getItem('lucky_spin_v1');
            if (saved) {
                try {
                    prizes = JSON.parse(saved);
                } catch (e) {
                    console.error("Lỗi data, load default", e);
                    prizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES));
                }
            } else {
                prizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES));
            }
        }

        function saveData() {
            localStorage.setItem('lucky_spin_v1', JSON.stringify(prizes));
            showToast("Đã lưu dữ liệu thành công!");
            drawWheel();
            updateAdminUI();
            updateRiggedOptions();
        }

        function resetToDefault() {
            if (confirm("Bạn có chắc muốn reset về mặc định? Dữ liệu hiện tại sẽ mất.")) {
                prizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES));
                saveData();
            }
        }

        // --- WHEEL RENDERING ---
        function drawWheel() {
            if (prizes.length === 0) return;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10; // Padding

            // Xóa canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Tính tổng weight
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let currentAngle = 0; // Bắt đầu từ 0 (góc 3h), nhưng ta sẽ xoay canvas để 0 ở 12h nếu muốn

            // Vẽ từng lát cắt
            prizes.forEach(prize => {
                // Góc của lát cắt này (radian)
                const sliceAngle = (prize.weight / totalWeight) * 2 * Math.PI;

                // Vẽ hình quạt
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = prize.color;
                ctx.fill();
                ctx.stroke();

                // Vẽ text và icon
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(currentAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 18px Arial";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;

                // Text (cắt ngắn nếu dài)
                let text = prize.title;
                if (text.length > 15) text = text.substring(0, 12) + "...";
                ctx.fillText(text, radius - 20, 5);

                // Icon
                if (prize.icon) {
                    ctx.font = "24px Arial";
                    ctx.fillText(prize.icon, radius - 150, 8); // Vị trí icon
                }

                ctx.restore();

                currentAngle += sliceAngle;
            });

            // Vẽ tâm vòng quay
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.stroke();
        }

        // --- SPIN LOGIC ---
        function spin() {
            if (isSpinning) return;
            if (prizes.length < 2) {
                alert("Cần ít nhất 2 giải thưởng để quay!");
                return;
            }

            // Init Audio Context on first user interaction
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isSpinning = true;
            spinBtn.disabled = true;
            playSound("spin");

            // 1. Chọn giải thưởng thắng cuộc
            let winnerIndex = -1;

            // Check Rigged Mode
            const riggedCheckbox = document.getElementById('riggedMode');
            const riggedSelect = document.getElementById('riggedIndex');

            if (riggedCheckbox.checked && riggedSelect.value !== "") {
                winnerIndex = parseInt(riggedSelect.value);
                console.log("Rigged winner:", prizes[winnerIndex].title);
            } else {
                // Random theo weight
                const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
                let random = Math.random() * totalWeight;

                for (let i = 0; i < prizes.length; i++) {
                    if (random < prizes[i].weight) {
                        winnerIndex = i;
                        break;
                    }
                    random -= prizes[i].weight;
                }
            }

            // 2. Tính toán góc quay
            // Góc bắt đầu của mỗi giải (tính dồn)
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let startWeight = 0;
            for (let i = 0; i < winnerIndex; i++) startWeight += prizes[i].weight;

            // Góc center của giải thắng (tính từ 0 radian)
            // Lưu ý: Canvas vẽ từ góc 0 (3 giờ). Indicator ở góc 270 độ (12 giờ).
            // Ta cần xoay sao cho center của giải thắng trùng với 270 độ.

            const sliceAngle = (prizes[winnerIndex].weight / totalWeight) * 360;
            const startAngle = (startWeight / totalWeight) * 360;
            const centerAngle = startAngle + sliceAngle / 2; // Góc của giải thắng trong hệ toạ độ vòng quay

            // Mục tiêu: centerAngle sau khi cộng thêm rotation phải trùng với 270 (hoặc -90) mod 360
            // currentRotation + delta = Target
            // Target position for the slice is 270 degrees.
            // So finalRotation % 360 should place centerAngle at 270.
            // => (centerAngle + finalRotation) % 360 = 270
            // => finalRotation = 270 - centerAngle + K * 360

            // Để quay ít nhất 5 vòng (1800 độ)
            const minSpins = 5;
            const baseRotation = 360 * minSpins;

            // Tính góc bù cần thiết
            // Hiện tại wheel đang ở currentRotation.
            // Góc hiển thị thực tế của giải thắng là (centerAngle + currentRotation) % 360.
            // Ta muốn nó về 270.

            let targetRotation = 270 - centerAngle;
            // Đảm bảo targetRotation > currentRotation để quay theo chiều kim đồng hồ
            while (targetRotation < currentRotation + baseRotation) {
                targetRotation += 360;
            }

            // Thêm chút ngẫu nhiên trong khoảng slice để kim không luôn chỉ vào giữa
            const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.8);
            targetRotation += randomOffset;

            // 3. Animation
            const duration = 5000; // 5 giây
            const startTime = performance.now();
            const startRotation = currentRotation;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing: Cubic Bezier (ease-out)
                // t => 1 - pow(1 - t, 3)
                const ease = 1 - Math.pow(1 - progress, 4);

                currentRotation = startRotation + (targetRotation - startRotation) * ease;

                // Rotate canvas container or draw with rotation
                // Ở đây ta dùng CSS transform cho performance tốt hơn là redraw canvas liên tục
                // Tuy nhiên, vì ta vẽ canvas tĩnh, ta chỉ cần xoay thẻ canvas
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                // Sound effect tick (optional - complex to sync perfectly)
                // Simple approach: play tick every X degrees? 
                // For simplicity, we skip dynamic ticking in this version or use a simple loop if needed.

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    endSpin(winnerIndex);
                }
            }

            requestAnimationFrame(animate);
        }

        function endSpin(winnerIndex) {
            isSpinning = false;
            spinBtn.disabled = false;
            const winner = prizes[winnerIndex];

            // Sound
            playSound("win");

            // Vibrate
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            // Show Result
            document.getElementById('modalIcon').textContent = winner.icon || '🎉';
            document.getElementById('modalTitle').textContent = winner.title;
            document.getElementById('modalDesc').textContent = winner.description || '';

            const couponDiv = document.getElementById('couponContainer');
            const couponCode = document.getElementById('couponCode');

            // Giả sử description chứa mã nếu có từ khoá "Mã:" hoặc "Code:"
            if (winner.description && (winner.description.includes("Mã:") || winner.description.includes("Code:"))) {
                couponDiv.style.display = 'block';
                // Extract code simple way
                const code = winner.description.split(/Mã:|Code:/)[1].trim();
                couponCode.textContent = code;
            } else {
                couponDiv.style.display = 'none';
            }

            modal.classList.add('active');

            // Auto spin logic check
            if (autoSpinCount > 0) {
                autoSpinCount--;
                setTimeout(() => {
                    modal.classList.remove('active');
                    if (autoSpinCount > 0) spin();
                }, 2000);
            }
        }

        // --- ADMIN PANEL LOGIC ---
        function updateAdminUI() {
            prizeListEl.innerHTML = '';
            prizes.forEach((p, index) => {
                const li = document.createElement('li');
                li.className = 'prize-item';
                li.style.borderLeftColor = p.color;
                li.innerHTML = `
                    <div class="prize-info">
                        <div class="prize-title">${p.icon} ${p.title}</div>
                        <div class="prize-weight">Weight: ${p.weight} | Color: ${p.color}</div>
                    </div>
                    <div class="prize-actions">
                        <button class="btn-sm" onclick="editPrize(${index})">✏</button>
                        <button class="btn-sm" onclick="deletePrize(${index})" style="background:#ff6b6b">🗑</button>
                    </div>
                `;
                prizeListEl.appendChild(li);
            });
        }

        function editPrize(index) {
            const p = prizes[index];
            document.getElementById('editId').value = index; // Dùng index làm ID tạm để sửa
            document.getElementById('editTitle').value = p.title;
            document.getElementById('editColor').value = p.color;
            document.getElementById('editWeight').value = p.weight;
            document.getElementById('editIcon').value = p.icon;
            document.getElementById('editDesc').value = p.description || '';

            // Scroll to form
            document.querySelector('.edit-form').scrollIntoView({ behavior: 'smooth' });
        }

        function deletePrize(index) {
            if (confirm("Xóa giải này?")) {
                prizes.splice(index, 1);
                updateAdminUI();
                drawWheel(); // Preview update
            }
        }

        function saveCurrentPrize() {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value;
            if (!title) {
                alert("Vui lòng nhập tên giải!");
                return;
            }

            const newPrize = {
                id: Date.now(), // Random ID
                title: title,
                color: document.getElementById('editColor').value,
                weight: parseInt(document.getElementById('editWeight').value) || 1,
                icon: document.getElementById('editIcon').value || '🎁',
                description: document.getElementById('editDesc').value
            };

            if (id !== "") {
                // Edit mode
                prizes[id] = newPrize;
                document.getElementById('editId').value = "";
            } else {
                // Add mode
                prizes.push(newPrize);
            }

            // Clear form
            document.getElementById('editTitle').value = "";
            document.getElementById('editDesc').value = "";

            updateAdminUI();
            drawWheel(); // Update preview immediately
            showToast("Đã cập nhật danh sách (Chưa lưu vào bộ nhớ)");
        }

        // --- UTILS ---
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function updateRiggedOptions() {
            const select = document.getElementById('riggedIndex');
            select.innerHTML = '<option value="">-- Ngẫu nhiên --</option>';
            prizes.forEach((p, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i + 1}. ${p.title}`;
                select.appendChild(opt);
            });
        }

        // --- AUDIO SYSTEM (Synthesized) ---
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === "spin") {
                // Rising sound
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === "win") {
                // Fanfare-ish
                const now = audioCtx.currentTime;

                // Chord C Major
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now);
                    g.gain.linearRampToValueAtTime(0.1, now + 0.1 + i * 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 2);
                    o.start(now);
                    o.stop(now + 2);
                });
            }
        }

        // --- EXPORT / IMPORT ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(prizes));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "lucky_spin_data.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const json = JSON.parse(e.target.result);
                    if (Array.isArray(json) && json.length > 0 && json[0].title) {
                        prizes = json;
                        saveData();
                        alert("Import thành công!");
                    } else {
                        alert("File JSON không hợp lệ!");
                    }
                } catch (err) {
                    alert("Lỗi đọc file!");
                }
            };
            reader.readAsText(file);
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            spinBtn.addEventListener('click', spin);

            document.getElementById('savePrizeBtn').addEventListener('click', saveCurrentPrize);
            document.getElementById('clearFormBtn').addEventListener('click', () => {
                document.getElementById('editId').value = "";
                document.getElementById('editTitle').value = "";
                document.getElementById('editDesc').value = "";
            });

            document.getElementById('saveAllBtn').addEventListener('click', saveData);
            document.getElementById('resetDefaultBtn').addEventListener('click', resetToDefault);

            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.classList.remove('active');
            });

            document.getElementById('couponCode').addEventListener('click', function () {
                navigator.clipboard.writeText(this.textContent);
                showToast("Đã copy mã!");
            });

            document.getElementById('toggleSoundBtn').addEventListener('click', function () {
                soundEnabled = !soundEnabled;
                this.textContent = soundEnabled ? "🔊 Bật âm thanh" : "🔇 Tắt âm thanh";
            });

            let autoSpinCount = 0;
            document.getElementById('autoSpinBtn').addEventListener('click', () => {
                const count = prompt("Nhập số lần quay tự động:", "5");
                if (count && !isNaN(count)) {
                    autoSpinCount = parseInt(count);
                    spin();
                }
            });

            document.getElementById('riggedMode').addEventListener('change', function () {
                document.getElementById('riggedIndex').disabled = !this.checked;
            });

            document.getElementById('exportBtn').addEventListener('click', exportData);
            document.getElementById('fileInput').addEventListener('change', importData);

            // Keyboard support
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    if (!modal.classList.contains('active') && !isSpinning) {
                        spin();
                    }
                }
                if (e.code === 'Escape') {
                    modal.classList.remove('active');
                }
            });
        }

        // Run
        window.addEventListener('load', init);

    </script>
</body>

</html>
