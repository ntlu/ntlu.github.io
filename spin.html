<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALACTIC SPINNER</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --space-black: #000000;
      --star-yellow: #FFE81F;
      --saber-blue: #4DEEEA;
      --saber-red: #FF0000;
      --saber-green: #2ed573;
      --panel-grey: #1a1a1a;
      --hologram-blue: rgba(77, 238, 234, 0.2);
      --text-glow: 0 0 10px var(--saber-blue);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background-color: var(--space-black);
      color: var(--saber-blue);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      perspective: 1000px;
    }

    /* Starfield Background */
    .starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Main Layout */
    .header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 30px 0;
      transform: rotateX(20deg);
      transform-style: preserve-3d;
    }

    h1 {
      color: var(--star-yellow);
      text-transform: uppercase;
      font-size: 3rem;
      letter-spacing: 5px;
      text-shadow: 0 0 20px rgba(255, 232, 31, 0.5);
      margin-bottom: 10px;
      text-align: center;
    }

    .lang-selector {
      margin-top: 10px;
      position: relative;
      z-index: 100;
    }

    select {
      background: rgba(0, 0, 0, 0.8);
      color: var(--saber-blue);
      border: 1px solid var(--saber-blue);
      padding: 8px 15px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 10px rgba(77, 238, 234, 0.1);
    }

    select:hover {
      box-shadow: 0 0 20px var(--saber-blue);
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 60px;
      justify-content: center;
      width: 100%;
      max-width: 1400px;
      padding: 20px;
      transform-style: preserve-3d;
    }

    /* Wheel Section */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transform: translateZ(0);
    }

    .wheel-container {
      position: relative;
      width: 450px;
      height: 450px;
      max-width: 90vw;
      max-height: 90vw;
      margin-bottom: 30px;
      border-radius: 50%;
      box-shadow:
        0 0 50px rgba(77, 238, 234, 0.1),
        inset 0 0 20px rgba(0, 0, 0, 0.8);
      background: radial-gradient(circle, #222 0%, #000 100%);
      border: 4px solid #333;
      transition: transform 0.5s;
    }

    .wheel-container::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border-radius: 50%;
      border: 2px dashed var(--saber-blue);
      animation: rotate-ring 20s linear infinite;
      pointer-events: none;
      opacity: 0.5;
    }

    @keyframes rotate-ring {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 0.1s;
      filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
    }

    /* Indicator */
    .indicator {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid var(--saber-red);
      /* Default, overridden by JS */
      z-index: 10;
      filter: drop-shadow(0 0 10px var(--saber-red));
      transition: border-top-color 0.1s, filter 0.1s;
    }

    /* Spin Button */
    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #333 0%, #000 100%);
      border-radius: 50%;
      border: 2px solid var(--saber-blue);
      color: var(--saber-blue);
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      z-index: 5;
      box-shadow: 0 0 20px var(--hologram-blue);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 5px var(--saber-blue);
      letter-spacing: 1px;
    }

    .spin-btn:hover {
      box-shadow: 0 0 40px var(--saber-blue);
      transform: translate(-50%, -50%) scale(1.1);
      background: #000;
    }

    .spin-btn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }

    .spin-btn:disabled {
      border-color: #555;
      color: #555;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      border: 1px solid var(--saber-blue);
      background: rgba(0, 0, 0, 0.8);
      color: var(--saber-blue);
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(77, 238, 234, 0.1);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(77, 238, 234, 0.2), transparent);
      transition: 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      background: var(--saber-blue);
      color: #000;
      box-shadow: 0 0 20px var(--saber-blue);
    }

    button.primary {
      border-color: var(--star-yellow);
      color: var(--star-yellow);
    }

    button.primary:hover {
      background: var(--star-yellow);
      color: #000;
      box-shadow: 0 0 20px var(--star-yellow);
    }

    button.danger {
      border-color: var(--saber-red);
      color: var(--saber-red);
    }

    button.danger:hover {
      background: var(--saber-red);
      color: #000;
      box-shadow: 0 0 20px var(--saber-red);
    }

    /* Admin Panel */
    .admin-panel {
      flex: 1;
      min-width: 350px;
      background: rgba(26, 26, 26, 0.9);
      padding: 25px;
      border: 1px solid #333;
      border-left: 4px solid var(--star-yellow);
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      max-height: 80vh;
      overflow-y: auto;
      backdrop-filter: blur(10px);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .admin-header h2 {
      color: var(--star-yellow);
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.8em;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      padding: 15px;
      background: #000;
      border: 1px solid #333;
      color: var(--saber-green);
      border-radius: 4px;
      min-height: 150px;
      font-family: 'Courier New', monospace;
      resize: vertical;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    textarea:focus {
      outline: none;
      border-color: var(--saber-green);
      box-shadow: 0 0 10px rgba(46, 213, 115, 0.2);
    }

    /* History List */
    .history-list {
      list-style: none;
      margin-top: 15px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #333;
      background: #000;
    }

    .history-item {
      padding: 10px;
      border-bottom: 1px solid #222;
      font-size: 0.9em;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    .history-item span {
      color: var(--star-yellow);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      perspective: 1000px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(0, 20, 40, 0.9);
      padding: 40px;
      border: 2px solid var(--saber-blue);
      border-radius: 10px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      transform: rotateX(20deg) scale(0.8);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow:
        0 0 50px rgba(77, 238, 234, 0.3),
        inset 0 0 50px rgba(77, 238, 234, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Hologram scanline effect */
    .modal-content::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, transparent 50%, rgba(77, 238, 234, 0.05) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    .modal-overlay.active .modal-content {
      transform: rotateX(0deg) scale(1);
    }

    .winner-icon {
      font-size: 80px;
      margin-bottom: 20px;
      display: block;
      filter: drop-shadow(0 0 20px var(--star-yellow));
    }

    .winner-title {
      font-size: 36px;
      color: var(--star-yellow);
      margin-bottom: 15px;
      text-shadow: 0 0 10px var(--star-yellow);
      text-transform: uppercase;
    }

    .winner-desc {
      color: var(--saber-blue);
      margin-bottom: 30px;
      font-size: 1.2em;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--saber-blue);
      color: var(--saber-blue);
      padding: 15px 30px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
      box-shadow: 0 0 20px rgba(77, 238, 234, 0.2);
    }

    .toast.show {
      opacity: 1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--saber-blue);
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
        letter-spacing: 2px;
        margin: 15px 0;
      }

      .main-container {
        flex-direction: column;
        align-items: center;
        gap: 30px;
        padding: 10px;
      }

      .wheel-container {
        width: 90vw;
        height: 90vw;
        max-width: 350px;
        max-height: 350px;
      }

      .spin-btn {
        width: 70px;
        height: 70px;
        font-size: 14px;
      }

      .controls {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      button {
        width: 100%;
        padding: 15px;
        font-size: 1rem;
      }

      .admin-panel {
        width: 100%;
        min-width: auto;
        padding: 15px;
      }

      .modal-content {
        width: 95%;
        padding: 20px;
      }

      .winner-icon {
        font-size: 60px;
      }

      .winner-title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="starfield" id="starfield"></div>

  <!-- Thanh điều hướng góc trên bên trái -->
  <div style="position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; gap: 12px; flex-wrap: wrap;">
    <a href="index.html"
      style="text-decoration: none; padding: 10px 15px; border: 1px solid var(--saber-blue); background: rgba(0,0,0,0.8); color: var(--saber-blue); border-radius: 4px; font-weight: bold; font-size: 12px; box-shadow: 0 0 10px rgba(77,238,234,0.2);">
      🏠 TRANG CHỦ
    </a>
    <a href="spin2.html"
      style="text-decoration: none; padding: 10px 15px; border: 1px solid var(--star-yellow); background: rgba(0,0,0,0.8); color: var(--star-yellow); border-radius: 4px; font-weight: bold; font-size: 12px; box-shadow: 0 0 10px rgba(255,232,31,0.2);"
      title="Chuyển sang phiên bản Premium Lucky Draw">
      ✨ V2
    </a>
  </div>

  <div class="header-container">
    <h1 data-i18n="appTitle">GALACTIC SPINNER</h1>
    <div class="lang-selector">
      <select id="langSelect">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="main-container">
    <!-- Wheel Section -->
    <div class="wheel-section">
      <div class="wheel-container">
        <div class="indicator"></div>
        <canvas id="wheelCanvas" width="450" height="450"></canvas>
        <button class="spin-btn" id="spinBtn" data-i18n="spinBtn">SPIN</button>
      </div>
      <div class="controls">
        <button id="toggleSoundBtn" data-i18n="soundOn" style="display: none;">🔊 SOUND ON</button>
        <button id="autoSpinBtn" data-i18n="autoSpin">🔄 AUTO SPIN</button>
      </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel">
      <div id="nameModeContent">
        <div class="admin-header">
          <h2 data-i18n="dataEntry">DATA ENTRY</h2>
        </div>
        <div class="form-group">
          <label data-i18n="enterNames">ENTER NAMES (ONE PER LINE):</label>
          <textarea id="nameInput"
            placeholder="Luke Skywalker&#10;Darth Vader&#10;Han Solo&#10;Leia Organa&#10;Yoda"></textarea>
        </div>
        <button class="primary" id="updateNameWheelBtn" style="width: 100%" data-i18n="updateData">UPDATE DATA</button>

        <div style="margin-top: 30px;">
          <h3 data-i18n="spinHistory">SPIN HISTORY</h3>
          <ul class="history-list" id="historyList">
            <!-- History items -->
          </ul>
          <button class="danger" id="clearHistoryBtn" style="margin-top: 10px; width: 100%;"
            data-i18n="clearHistory">CLEAR HISTORY</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-content">
      <span class="winner-icon" id="modalIcon">⭐</span>
      <h2 class="winner-title" id="modalTitle" data-i18n="winnerTitle">WINNER</h2>
      <p class="winner-desc" id="modalDesc" data-i18n="winnerDesc">The Force is strong with this one.</p>

      <div id="nameModeButtons" style="display: flex; gap: 15px; margin-top: 20px;">
        <button class="primary" id="keepWinnerBtn" style="flex: 1;" data-i18n="keepBtn">KEEP</button>
        <button class="danger" id="removeWinnerBtn" style="flex: 1;" data-i18n="removeBtn">REMOVE</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">Notification</div>

  <script>
    /**
     * GALACTIC SPINNER APP
     */

    // --- TRANSLATIONS ---
    const translations = {
      en: {
        appTitle: "GALACTIC SPINNER",
        spinBtn: "SPIN",
        soundOn: "🔊 SOUND ON",
        soundOff: "🔇 SOUND OFF",
        autoSpin: "🔄 AUTO SPIN",
        dataEntry: "DATA ENTRY",
        enterNames: "ENTER NAMES (ONE PER LINE):",
        updateData: "UPDATE DATA",
        spinHistory: "SPIN HISTORY",
        clearHistory: "CLEAR HISTORY",
        winnerTitle: "WINNER",
        winnerDesc: "The Force is strong with this one.",
        keepBtn: "KEEP",
        removeBtn: "REMOVE",
        noData: "NO DATA",
        needMoreNames: "NEED AT LEAST 2 NAMES!",
        removed: "REMOVED",
        enterAutoCount: "ENTER AUTO SPIN COUNT:",
        confirmClear: "CLEAR ALL HISTORY?",
        placeholder: "Luke Skywalker\nDarth Vader\nHan Solo\nLeia Organa\nYoda"
      },
      vi: {
        appTitle: "VÒNG QUAY ZŨ TRỤ",
        spinBtn: "QUAY",
        soundOn: "🔊 BẬT TIẾNG",
        soundOff: "🔇 TẮT TIẾNG",
        autoSpin: "🔄 TỰ ĐỘNG",
        dataEntry: "NHẬP DỮ LIỆU",
        enterNames: "NHẬP TÊN (MỖI DÒNG 1 TÊN):",
        updateData: "CẬP NHẬT",
        spinHistory: "LỊCH SỬ QUAY",
        clearHistory: "XÓA LỊCH SỬ",
        winnerTitle: "CHIẾN THẮNG",
        winnerDesc: "Thần lực đang ở cùng người này.",
        keepBtn: "GIỮ LẠI",
        removeBtn: "XÓA TÊN",
        noData: "CHƯA CÓ DỮ LIỆU",
        needMoreNames: "CẦN ÍT NHẤT 2 TÊN!",
        removed: "ĐÃ XÓA",
        enterAutoCount: "NHẬP SỐ LẦN QUAY:",
        confirmClear: "XÓA TOÀN BỘ LỊCH SỬ?",
        placeholder: "Nguyễn Văn A\nTrần Thị B\nLê Văn C\nPhạm Thị D\nHoàng Văn E"
      }
    };

    // --- STATE ---
    let currentLang = localStorage.getItem('galactic_lang') || 'vi';
    let nameList = [];
    let history = [];
    let currentWinner = null;

    let isSpinning = false;
    let currentRotation = 0;
    let soundEnabled = true;
    let audioCtx = null;

    // --- DOM ELEMENTS ---
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const modal = document.getElementById('resultModal');
    const langSelect = document.getElementById('langSelect');

    // --- INITIALIZATION ---
    function init() {
      createStars();

      // Set initial language
      langSelect.value = currentLang;
      applyLanguage(currentLang);

      loadData();

      // If no data, set some defaults based on language
      if (nameList.length === 0) {
        document.getElementById('nameInput').value = translations[currentLang].placeholder;
        parseNames();
      } else {
        drawWheel();
      }
      setupEventListeners();
    }

    function createStars() {
      const starfield = document.getElementById('starfield');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 2 + 's';
        starfield.appendChild(star);
      }
    }

    // --- I18N LOGIC ---
    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('galactic_lang', lang);

      // Update static text
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      // Update sound button state text
      const soundBtn = document.getElementById('toggleSoundBtn');
      soundBtn.textContent = soundEnabled ? translations[lang].soundOn : translations[lang].soundOff;

      // Update placeholder if empty or default
      const input = document.getElementById('nameInput');
      // Only update placeholder attribute, not value unless it's empty
      input.setAttribute('placeholder', translations[lang].placeholder);
    }

    // --- DATA MANAGEMENT ---
    function loadData() {
      const savedNames = localStorage.getItem('galactic_spin_names');
      if (savedNames) {
        document.getElementById('nameInput').value = savedNames;
        parseNames();
      }

      const savedHistory = localStorage.getItem('galactic_spin_history');
      if (savedHistory) {
        history = JSON.parse(savedHistory);
        updateHistoryUI();
      }
    }

    // --- NAME PICKER LOGIC ---
    function parseNames() {
      const input = document.getElementById('nameInput').value;
      const lines = input.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      // Star Wars Palette
      const colors = [
        '#FF0000', // Red (Sith)
        '#4DEEEA', // Cyan (Jedi)
        '#FFE81F', // Yellow (Logo)
        '#2ed573', // Green (Luke)
        '#a55eea', // Purple (Mace Windu)
        '#ff9f43'  // Orange (BB8)
      ];

      nameList = lines.map((name, index) => ({
        id: index,
        title: name,
        color: colors[index % colors.length],
        weight: 1
      }));

      localStorage.setItem('galactic_spin_names', input);
      drawWheel();
    }

    function updateHistoryUI() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      history.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span>#${index + 1}</span> ${item}`;
        list.appendChild(li);
      });
    }

    function removeCurrentWinner() {
      if (!currentWinner) return;

      const input = document.getElementById('nameInput');
      const lines = input.value.split('\n').map(l => l.trim());
      const newLines = lines.filter(l => l !== currentWinner.title);
      input.value = newLines.join('\n');

      parseNames();
      showToast(`${translations[currentLang].removed} "${currentWinner.title}"`);
      modal.classList.remove('active');
    }

    // --- WHEEL RENDERING ---
    function drawWheel() {
      const data = nameList;

      if (data.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "20px Orbitron";
        ctx.fillStyle = "#4DEEEA";
        ctx.textAlign = "center";
        ctx.fillText(translations[currentLang].noData, canvas.width / 2, canvas.height / 2);
        return;
      }

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const totalWeight = data.reduce((sum, p) => sum + p.weight, 0);
      let currentAngle = 0;

      data.forEach(prize => {
        const sliceAngle = (prize.weight / totalWeight) * 2 * Math.PI;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
        ctx.closePath();

        // Gradient for 3D effect
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
        gradient.addColorStop(0, adjustColor(prize.color, -40));
        gradient.addColorStop(0.6, prize.color);
        gradient.addColorStop(1, adjustColor(prize.color, -20));

        ctx.fillStyle = gradient;
        ctx.fill();

        // Slice border
        ctx.strokeStyle = "rgba(0,0,0,0.5)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(currentAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Orbitron";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 4;

        let text = prize.title;
        if (text.length > 18) text = text.substring(0, 15) + "...";
        ctx.fillText(text, radius - 30, 6);

        ctx.restore();
        currentAngle += sliceAngle;
      });

      // Center cap
      ctx.beginPath();
      ctx.arc(centerX, centerY, 25, 0, 2 * Math.PI);
      ctx.fillStyle = "#000";
      ctx.fill();
      ctx.strokeStyle = "#4DEEEA";
      ctx.lineWidth = 2;
      ctx.stroke();

      updateIndicatorColor(currentRotation);
    }

    // Helper to darken/lighten hex color
    function adjustColor(color, amount) {
      return '#' + color.replace(/^#/, '').replace(/../g, color => ('0' + Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
    }

    // --- SPIN LOGIC ---
    function spin() {
      if (isSpinning) return;
      const data = nameList;

      if (data.length < 2) {
        showToast(translations[currentLang].needMoreNames);
        return;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isSpinning = true;
      spinBtn.disabled = true;
      playSound("spin");

      let winnerIndex = -1;

      // Random selection
      const totalWeight = data.reduce((sum, p) => sum + p.weight, 0);
      let random = Math.random() * totalWeight;
      for (let i = 0; i < data.length; i++) {
        if (random < data[i].weight) {
          winnerIndex = i;
          break;
        }
        random -= data[i].weight;
      }

      const startWeight = data.slice(0, winnerIndex).reduce((sum, p) => sum + p.weight, 0);

      const sliceAngle = (data[winnerIndex].weight / totalWeight) * 360;
      const startAngle = (startWeight / totalWeight) * 360;
      const centerAngle = startAngle + sliceAngle / 2;

      const minSpins = 5;
      const baseRotation = 360 * minSpins;

      let targetRotation = 270 - centerAngle;
      while (targetRotation < currentRotation + baseRotation) {
        targetRotation += 360;
      }
      const randomOffset = (Math.random() - 0.5) * (sliceAngle * 0.8);
      targetRotation += randomOffset;

      const duration = 5000;
      const startTime = performance.now();
      const startRotation = currentRotation;

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 4);

        currentRotation = startRotation + (targetRotation - startRotation) * ease;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        updateIndicatorColor(currentRotation);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          endSpin(winnerIndex);
        }
      }
      requestAnimationFrame(animate);
    }

    function updateIndicatorColor(rotation) {
      const data = nameList;
      if (data.length === 0) return;

      const totalWeight = data.reduce((sum, p) => sum + p.weight, 0);

      // Calculate angle at the top (270 degrees)
      // rotation is clockwise, so we subtract it from 270
      let angleAtTop = (270 - rotation) % 360;
      if (angleAtTop < 0) angleAtTop += 360;

      let currentAngle = 0;
      let activeColor = '#FF0000'; // Default

      for (const prize of data) {
        const sliceAngle = (prize.weight / totalWeight) * 360;
        if (angleAtTop >= currentAngle && angleAtTop < currentAngle + sliceAngle) {
          activeColor = prize.color;
          break;
        }
        currentAngle += sliceAngle;
      }

      const indicator = document.querySelector('.indicator');
      indicator.style.borderTopColor = activeColor;
      indicator.style.filter = `drop-shadow(0 0 10px ${activeColor})`;
    }

    function endSpin(winnerIndex) {
      isSpinning = false;
      spinBtn.disabled = false;

      const data = nameList;
      const winner = data[winnerIndex];
      currentWinner = winner;

      playSound("win");
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      document.getElementById('modalTitle').textContent = winner.title;

      // Add to history
      history.push(winner.title);
      localStorage.setItem('galactic_spin_history', JSON.stringify(history));
      updateHistoryUI();

      modal.classList.add('active');

      // Auto spin logic
      if (window.autoSpinCount && window.autoSpinCount > 0) {
        window.autoSpinCount--;
        setTimeout(() => {
          modal.classList.remove('active');
          if (window.autoSpinCount > 0) spin();
        }, 2000);
      }
    }

    // --- UTILS ---
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // --- AUDIO SYSTEM ---
    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "spin") {
        // Lightsaber hum effect
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);

        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === "win") {
        // Victory fanfare
        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C

        notes.forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);

          o.type = 'square';
          o.frequency.value = freq;

          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(0.05, now + 0.1 + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

          o.start(now);
          o.stop(now + 1.5);
        });
      }
    }

    // --- EVENT LISTENERS ---
    function setupEventListeners() {
      spinBtn.addEventListener('click', spin);

      // Language Switcher
      langSelect.addEventListener('change', (e) => {
        applyLanguage(e.target.value);
        // Redraw wheel to update "NO DATA" text if empty
        drawWheel();
      });

      // Name Mode Events
      document.getElementById('updateNameWheelBtn').addEventListener('click', parseNames);
      document.getElementById('nameInput').addEventListener('input', parseNames);

      document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        if (confirm(translations[currentLang].confirmClear)) {
          history = [];
          localStorage.removeItem('galactic_spin_history');
          updateHistoryUI();
        }
      });

      // Modal Buttons
      document.getElementById('keepWinnerBtn').addEventListener('click', () => {
        modal.classList.remove('active');
      });
      document.getElementById('removeWinnerBtn').addEventListener('click', removeCurrentWinner);

      // Common Events
      document.getElementById('toggleSoundBtn').addEventListener('click', function () {
        soundEnabled = !soundEnabled;
        this.textContent = soundEnabled ? translations[currentLang].soundOn : translations[currentLang].soundOff;
      });

      document.getElementById('autoSpinBtn').addEventListener('click', () => {
        const count = prompt(translations[currentLang].enterAutoCount, "5");
        if (count && !isNaN(count)) {
          window.autoSpinCount = parseInt(count);
          spin();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          if (modal.classList.contains('active')) {
            // Do nothing
          } else if (!isSpinning && document.activeElement.tagName !== 'TEXTAREA') {
            spin();
          }
        }
        if (e.code === 'Escape') {
          modal.classList.remove('active');
        }
      });
    }

    // Run
    window.addEventListener('load', init);
  </script>
